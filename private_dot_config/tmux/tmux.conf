# 24 bit color
set -g default-terminal "tmux-256color"

# Tell tmux about the outer terminal's capabilities. tmux 3.7c detects
# clipboard/ccolour/cstyle/focus/title/RGB for xterm* automatically, but it
# does not know ghostty (xterm-ghostty) and never sets extkeys/sync/etc, so
# declare them explicitly. Note: matching terminal-features entries are merged.
# (The old `set -ag terminal-overrides ",$TERM:RGB"` did nothing: $TERM expands
#  to the inner tmux-256color, not the outer client, so it has been dropped.)
# Reset first so repeated `source-file` reloads don't pile up duplicates.
set -gu terminal-features
set -ag terminal-features 'xterm*:extkeys:sync:hyperlinks:usstyle:strikethrough:overline'

# Change prefix to C-s
set-option -g prefix C-s
unbind-key C-b
# Make C-s C-s go through
bind-key C-s send-prefix
# For tmux-in-tmux: S-up switches the outer tmux to a rarely-used prefix
# (M-s) so that C-s passes through to the inner tmux; S-down restores C-s.
bind -n S-up \
set -g status-bg white \; \
set -g prefix M-s

bind -n S-down \
set -g prefix C-s \; \
set -g status-bg green

# Enable mouse
set-option -g mouse on

# Pi agent require this
set -g extended-keys on
set -g extended-keys-format csi-u

# Focus events (so e.g. neovim knows when tmux loses focus). Needs a
# detach/attach to take effect after changing.
set -g focus-events on

# Let applications set the system clipboard via OSC 52 (ghostty supports it).
set -g set-clipboard on

# Use Vi keybindings in copy mode
set-window-option -g mode-keys vi

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Easy config reload
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

bind-key = split-window -h
bind-key - split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key t next-window
bind-key T previous-window
bind-key space next-window
bind-key bspace previous-window

bind-key enter next-layout

bind-key q kill-pane

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down
