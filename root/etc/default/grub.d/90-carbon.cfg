# Sourced by grub-mkconfig. Never copy a disk UUID or swap offset between hosts.
carbon_filter_args() {
    for carbon_arg in $1; do
        case "$carbon_arg" in
            video=eDP-1:*|resume=*|resume_offset=*) ;;
            *) printf '%s ' "$carbon_arg" ;;
        esac
    done
}
GRUB_CMDLINE_LINUX_DEFAULT="$(carbon_filter_args "${GRUB_CMDLINE_LINUX_DEFAULT:-}")video=eDP-1:1920x1200@60"
GRUB_CMDLINE_LINUX="$(carbon_filter_args "${GRUB_CMDLINE_LINUX:-}")"
if [ -f /swap/swapfile ]; then
    carbon_resume_uuid=$(findmnt -n -o UUID -T /swap/swapfile)
    carbon_resume_offset=$(btrfs inspect-internal map-swapfile -r /swap/swapfile)
    if [ -z "$carbon_resume_uuid" ] || [ -z "$carbon_resume_offset" ]; then
        echo 'carbon: cannot determine hibernation resume device/offset' >&2
        exit 1
    fi
    GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX}resume=UUID=$carbon_resume_uuid resume_offset=$carbon_resume_offset"
fi
