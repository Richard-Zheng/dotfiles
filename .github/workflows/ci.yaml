name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [archlinux, ubuntu-24.04]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test install
        run: |
          scripts/test.sh --os "${{ matrix.os }}"
